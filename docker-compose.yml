version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"  
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api 
  api:
    build: . 
    depends_on:
      - db
      - cache
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: url_db
    ports:
      - "5432:5432"
 
  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"